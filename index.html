<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フェリスの自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー（上の箱） -->
  <header class="box header-box">
    <h1>⚔フェリスのプロフィール⚔</h1>
    <p>毎日寝不足な僕のプロフィールだよ</p>
    
    <!-- 項目ボタン（ナビゲーション） -->
    <nav class="nav-buttons">
      <a href="#profile" class="nav-btn">基本情報</a>
      <a href="#hobby" class="nav-btn">好きなこと</a>
      <a href="#message" class="nav-btn">ひとこと</a>
    </nav>
  </header>

  <!-- メインエリア -->
  <main class="container">
    
    <!-- 基本情報（箱1） -->
    <section id="profile" class="box profile-box">
      <h2>⚔基本情報⚔</h2>
      <ul>
        <li><strong>名前：</strong> フェリス</li>
        <li><strong>職業：</strong> コード手打ち練習中</li>
        <li><strong>年齢：</strong> 18歳</li>
        <li><strong>出身地：</strong> 愛知県</li>
      </ul>
    </section>

    <!-- 好きなもの・特技（箱2） -->
    <section id="hobby" class="box hobby-box">
      <h2>⚔好きなこと・特技⚔</h2>
      <ul>
        <li>コード手打ち</li>
        <li>スマホをいじること</li>
        <li>ゲームをすること</li>
        <li>ゲーム制作中</li>
      </ul>
    </section>

    <!-- 一言メッセージ（箱3） -->
    <section id="message" class="box message-box">
      <h2>⚔ひとこと⚔</h2>
      <p>昼夜逆転状態であり、徹夜はたまにやっています。</p>
    </section>

  </main>

  <!-- フッター（下の箱） -->
  <footer class="box footer-box">
    <p>&copy; 2026 fyeris profile</p>
  </footer>

</body>
</html>
